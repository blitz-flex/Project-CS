<aside class="admin-sidebar" id="adminSidebar">
    <div class="sidebar-header">
        <a href="/" class="d-flex align-items-center gap-3 text-decoration-none">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" style="height: 42px; filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3));">
            <span class="fs-5 fw-bold text-white tracking-tighter text-uppercase">SENTINEL<span class="text-gold">.</span></span>
        </a>
    </div>
    
    <nav class="sidebar-nav">
        <a href="/admin" class="sidebar-link {% if request.path == '/admin' %}active{% endif %}">
            <i class="fas fa-th-large"></i> პანელი
        </a>
        <a href="/admin/courses" class="sidebar-link {% if '/admin/courses' in request.path or '/admin/courses/new' in request.path or '/admin/courses/edit' in request.path %}active{% endif %}">
            <i class="fas fa-book"></i> კურსები
        </a>
        <a href="/admin/users" class="sidebar-link {% if request.path == '/admin/users' %}active{% endif %}">
            <i class="fas fa-users"></i> მომხმარებლები
        </a>
        <a href="/admin/stats" class="sidebar-link {% if request.path == '/admin/stats' %}active{% endif %}">
            <i class="fas fa-chart-line"></i> ანალიტიკა
        </a>
        <a href="/admin/cupon" class="sidebar-link {% if request.path == '/admin/cupon' %}active{% endif %}">
            <i class="fas fa-ticket-alt"></i> კუპონები
        </a>
        
        <div class="mt-auto mb-4 px-3">
            <a href="/" class="admin-nav-exit-card text-decoration-none">
                <div class="p-3 rounded-4" style="background: rgba(212, 175, 55, 0.05); border: 1px dashed rgba(212, 175, 55, 0.3); transition: all 0.3s ease;">
                    <div class="d-flex align-items-center gap-3">
                        <div class="icon-box m-0 bg-gold text-black shadow-gold" style="width: 40px; height: 40px;"><i class="fas fa-home"></i></div>
                        <div>
                            <p class="smaller text-gold text-uppercase fw-bold mb-0">მთავარი გვერდი</p>
                            <span class="text-white opacity-50 smaller">საიტზე დაბრუნება</span>
                        </div>
                    </div>
                </div>
            </a>
        </div>

        <div class="px-3 pb-4">
            <a href="/logout" class="sidebar-link text-danger opacity-50">
                <i class="fas fa-sign-out-alt"></i> სისტემიდან გასვლა
            </a>
        </div>
    </nav>
</aside>
