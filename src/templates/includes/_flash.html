{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div class="container mt-3">
            {% for category, message in messages %}
                <div class="alert alert-{{ category if category != 'message' else 'success' }} bg-{{ category if category != 'message' else 'success' }} bg-opacity-10 border-0 alert-dismissible fade show" role="alert" style="border-radius: 20px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05) !important;">
                    <div class="d-flex align-items-center gap-3">
                        <i class="fas fa-info-circle text-gold"></i>
                        <span class="text-white">{{ message }}</span>
                    </div>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        </div>
    {% endif %}
{% endwith %}
