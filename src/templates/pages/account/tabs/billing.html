<div id="billing" class="tab-content-section">
    <div class="content-header"><h3>გადახდების ისტორია</h3></div>
    <div class="premium-card p-0 overflow-hidden border-white border-opacity-5">
        <div class="d-flex flex-column">
            {% for c in ids %}
            <div class="p-4 {% if not loop.last %}border-bottom border-white border-opacity-5{% endif %} hover-bg-gold-5 transition-all">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="icon-box smaller bg-gold bg-opacity-10 text-gold border-0" style="width: 45px; height: 45px;">
                            <i class="fas fa-shopping-cart"></i>
                        </div>
                        <div>
                            <h6 class="text-white fw-bold mb-1">{{ c.name }}</h6>
                            <div class="d-flex align-items-center gap-2">
                                <span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-20 px-2 py-1" style="font-size: 0.6rem;">COMPLETED</span>
                            </div>
                        </div>
                    </div>
                    <div class="text-end">
                        <div class="text-gold fw-bold mb-0" style="font-size: 1.1rem;">{{ c.price }}₾</div>
                        <small class="text-muted smaller">Online Payment</small>
                    </div>
                </div>
            </div>
            {% endfor %}

            {% if not ids %}
            <div class="p-5 text-center text-muted">
                <i class="fas fa-receipt fa-3x mb-3 opacity-20"></i>
                <p class="mb-0">ტრანზაქციები არ მოიძებნა</p>
            </div>
            {% endif %}
        </div>
    </div>
</div>
