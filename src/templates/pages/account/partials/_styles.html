<style>
    /* Global Dashboard Layout */
    .dashboard-wrapper {
        padding-top: 120px;
        padding-bottom: 80px;
        background: 
            radial-gradient(circle at top right, rgba(30, 58, 138, 0.15), transparent 40%),

        min-height: 100vh;
        position: relative;
    }

    /* Navigation Sidebar Refined */
    .premium-sidebar-nav {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.05);

        padding: 12px;
        position: sticky;
        top: 120px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }
    .account-nav-btn {
        width: 100%; text-align: left; background: none; border: none;
        padding: 15px 18px; border-radius: 16px; color: rgba(255,255,255,0.4);
        font-weight: 600; transition: all 0.3s ease; display: flex; align-items: center; gap: 12px;
        margin-bottom: 5px; position: relative;
    }
    .account-nav-btn:hover { background: rgba(255,255,255,0.03); color: #fff; }
    .account-nav-btn.active { background: rgba(212, 175, 55, 0.08); color: var(--primary-gold); }
    .account-nav-btn.active::before {
        content: ''; position: absolute; left: 0; top: 25%; height: 50%;
        width: 3px; background: var(--primary-gold); border-radius: 0 4px 4px 0;
        box-shadow: 0 0 10px var(--primary-gold);

    .sidebar-footer { margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.05); }
    .logout-btn-minimal {
        display: flex; align-items: center; gap: 12px; padding: 14px 18px;

        transition: 0.3s; border-radius: 16px;
    }
    .logout-btn-minimal:hover { background: rgba(255, 68, 68, 0.08); color: #ff4444; }

    /* Tabs Content */
    .tab-content-section { display: none; }
    .tab-content-section.active { display: block; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .content-header { margin-bottom: 30px; }
    .content-header h3 { font-size: 1.6rem; font-weight: 800; color: #fff; }

    /* Premium Input Styling */
    .premium-form-group { margin-bottom: 25px; }
    .premium-form-label {
        display: block; color: rgba(255,255,255,0.4); font-size: 0.75rem;
        font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;
    }
    .premium-input-field {
        width: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px; padding: 15px 20px; color: #fff; font-weight: 500;
        transition: all 0.3s ease; outline: none;
    }
    .premium-input-field:focus {
        border-color: var(--primary-gold); background: rgba(212,175,55,0.05);
        box-shadow: 0 0 20px rgba(212,175,55,0.1);
    }
    .premium-input-field::placeholder { color: rgba(255,255,255,0.2); }

    /* Course Cards */
    .account-course-card {
        background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
        border-radius: 24px; overflow: hidden; transition: all 0.4s ease;
        position: relative;
    }
    .course-delete-btn-wrapper {
        position: absolute; top: 12px; right: 12px; z-index: 20;
        opacity: 0; transform: scale(0.8); transition: all 0.3s;
    }
    .account-course-card:hover .course-delete-btn-wrapper { opacity: 1; transform: scale(1); }

        width: 36px; height: 36px; background: rgba(20, 20, 20, 0.6);

        border-radius: 12px; color: rgba(255,255,255,0.5); display: flex;
        align-items: center; justify-content: center; cursor: pointer; transition: 0.3s;
    }
    .btn-action-delete:hover { background: #ff4444; color: #fff; border-color: #ff4444; }

    /* Mobile Responsiveness */
    @media (max-width: 991px) {

            padding-top: 80px;
            padding-bottom: 40px;

        .account-nav-btn {
            width: auto;
            margin-bottom: 0;
            white-space: nowrap;
            padding: 10px 18px;
            font-size: 0.85rem;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .account-nav-btn.active {
            background: var(--primary-gold);
            color: #000;
        }
        .account-nav-btn.active::before {
            display: none; 
        }
        .sidebar-footer {
            margin-top: 0;
            padding-top: 0;
            border-top: none;
            display: flex;
        }
        .logout-btn-minimal {
            background: rgba(255, 68, 68, 0.1);
            padding: 10px 18px;
            white-space: nowrap;
        }
        .premium-card.p-4.p-md-5 {
            padding: 1.25rem !important;

        .account-course-card {
            margin-bottom: 10px;
        }
        .account-course-card .p-4 {

        .table-responsive-mobile thead { display: none; }
        .table-responsive-mobile tbody tr {
            display: block;
            margin-bottom: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 1rem;
        }
        .table-responsive-mobile td {
            display: flex !important;
            flex-direction: row !important;
            justify-content: space-between !important;
            align-items: center !important;
            padding: 0.75rem 0 !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important;
            text-align: left;
        }
        .table-responsive-mobile td:last-child { border-bottom: none !important; }
        .table-responsive-mobile td::before {
            content: attr(data-label);
            font-weight: 800;
            color: var(--primary-gold);
            text-transform: uppercase;
            font-size: 0.65rem;
            letter-spacing: 1px;
            margin-bottom: 0;
        }
    }
