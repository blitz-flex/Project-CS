{% extends "layouts/admin.html" %}

{% block title %}ახალი მოდულის დამატება{% endblock %}

{% block main %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-end mb-5">
                <div>
                    <h2 class="text-white fw-bold mb-1">ახალი მოდული</h2>
                    <p class="text-muted small mb-0">შექმენით ახალი სასწავლო პროგრამა</p>
                </div>
                <a href="/admin/courses" class="text-muted text-decoration-none small hover-gold transition-all">
                    <i class="fas fa-times me-2"></i> გაუქმება
                </a>
            </div>

            <form method="POST" enctype="multipart/form-data">
                <div class="premium-card p-4 p-md-5 border-white border-opacity-5" style="background: rgba(15, 23, 42, 0.4);">
                    <!-- Module Name -->
                    <div class="mb-5">
                        <label class="small text-muted text-uppercase letter-spacing-1 fw-bold mb-2 d-block" style="font-size: 0.65rem;">დასახელება</label>
                        <input type="text" class="minimal-input h3" id="name" name="name" required placeholder="კურსის სახელი">
                    </div>

                    <div class="row g-4 mb-5">
                        <!-- Price -->
                        <div class="col-md-6">
                            <label class="small text-muted text-uppercase letter-spacing-1 fw-bold mb-2 d-block" style="font-size: 0.65rem;">ღირებულება (₾)</label>
                            <input type="number" class="minimal-input" id="price" name="price" min="0" required value="0">
                        </div>

                        <!-- Image Upload -->
                        <div class="col-md-6">
                            <label class="small text-muted text-uppercase letter-spacing-1 fw-bold mb-2 d-block" style="font-size: 0.65rem;">მთავარი ფოტო</label>
                            <input type="file" class="minimal-input" id="image" name="image" accept="image/*" required style="font-size: 0.8rem; padding: 10px;">
                        </div>
                    </div>

                    <!-- Description -->
                    <div class="mb-5">
                        <label class="small text-muted text-uppercase letter-spacing-1 fw-bold mb-2 d-block" style="font-size: 0.65rem;">კურსის აღწერა</label>
                        <textarea class="minimal-input" id="description" name="description" rows="6" placeholder="აღწერეთ კურსის შინაარსი..."></textarea>
                    </div>

                    <!-- Submit -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-gold py-3 fw-bold shadow-gold">
                            მოდულის შექმნა <i class="fas fa-plus ms-2"></i>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .minimal-input {
        width: 100%;
        background: rgba(255, 255, 255, 0.02) !important;
        border: 1px solid rgba(255, 255, 255, 0.05) !important;
        border-radius: 14px !important;
        color: #fff !important;
        padding: 14px 20px !important;
        outline: none;
        transition: all 0.3s ease;
    }

    .minimal-input:focus {
        border-color: var(--primary-gold) !important;
        background: rgba(212, 175, 55, 0.04) !important;
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.05);
    }

    .minimal-input.h3 {
        font-size: 1.8rem;
        font-weight: 800;
        background: transparent !important;
        border: none !important;
        border-bottom: 2px solid rgba(255, 255, 255, 0.05) !important;
        border-radius: 0 !important;
        padding: 10px 0 !important;
    }

    .minimal-input.h3:focus {
        border-bottom-color: var(--primary-gold) !important;
    }

    textarea.minimal-input {
        resize: none;
    }

    .letter-spacing-1 { letter-spacing: 1px; }
</style>
{% endblock %}
