{% extends "layouts/admin.html" %}

{% block title %}ახალი მოდულის დამატება{% endblock %}
{% block header %}ახალი მოდულის დამატება{% endblock %}

{% block main %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 class="text-white fw-bold mb-1 cyber-glow"><i class="fas fa-cube me-2 text-gold"></i> ახალი მოდული</h4>
                    <p class="text-muted small mb-0 opacity-75">შექმენით ახალი სასწავლო პროგრამა სისტემაში</p>
                </div>
                <a href="/admin/courses" class="btn btn-cyber-outline btn-sm px-3 py-2 text-muted border-secondary hover-gold">
                    <i class="fas fa-arrow-left me-2"></i> უკან დაბრუნება
                </a>
            </div>

            <form method="POST" enctype="multipart/form-data">
                <div class="bg-dark-glass p-4 p-md-5 rounded-4 border border-white border-opacity-5 shadow-2xl position-relative overflow-hidden">
                    
                    <!-- Decorative Element -->
                    <div class="position-absolute top-0 start-0 w-100 bg-gold opacity-50" style="height: 3px;"></div>
                    
                    <!-- Module Name -->
                    <div class="mb-4 position-relative">
                        <label class="small text-gold text-uppercase letter-spacing-1 fw-bold mb-2 d-block">კურსის დასახელება</label>
                        <input type="text" class="minimal-input h3 form-control-cyber" id="name" name="name" required placeholder="მაგ: Advanced Cyber Warfare">
                    </div>

                    <div class="row g-4 mb-4">
                        <!-- Price -->
                        <div class="col-md-6">
                            <label class="small text-muted text-uppercase letter-spacing-1 fw-bold mb-2 d-block">ღირებულება (₾)</label>
                            <div class="position-relative">
                                <i class="fas fa-coins position-absolute top-50 start-0 translate-middle-y ms-3 text-gold opacity-50"></i>
                                <input type="number" class="minimal-input form-control-cyber ps-5" id="price" name="price" min="0" required value="0">
                            </div>
                        </div>

                        <!-- Image Upload -->
                        <div class="col-md-6">
                            <label class="small text-muted text-uppercase letter-spacing-1 fw-bold mb-2 d-block">მთავარი ფოტო</label>
                            <input type="file" class="minimal-input form-control-cyber p-2" id="image" name="image" accept="image/*" required>
                        </div>
                    </div>

                    <!-- Description -->
                    <div class="mb-5">
                        <label class="small text-muted text-uppercase letter-spacing-1 fw-bold mb-2 d-block">კურსის აღწერა</label>
                        <textarea class="minimal-input form-control-cyber" id="description" name="description" rows="5" placeholder="აღწერეთ კურსის შინაარსი..."></textarea>
                    </div>

                    <!-- Submit -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-cyber-primary py-3 fw-bold text-uppercase letter-spacing-1">
                            <i class="fas fa-upload me-2"></i> მოდულის შექმნა და ატვირთვა
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .form-control-cyber {
        width: 100%;
        background: rgba(10, 12, 16, 0.8) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        border-radius: 12px !important;
        color: #fff !important;
        padding: 14px 20px !important;
        outline: none;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .form-control-cyber:focus {
        border-color: var(--primary-gold) !important;
        background: rgba(212, 175, 55, 0.05) !important;
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
    }
    .form-control-cyber.h3 {
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: 0.5px;
    }
</style>
{% endblock %}
