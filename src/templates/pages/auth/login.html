{% extends "layouts/auth.html" %}

{% block title %}ავტორიზაცია | Sentinel Academy{% endblock %}

{% block main %}
<div class="text-center mb-4">
    <h3 class="text-white fw-bold">ავტორიზაცია</h3>
</div>

<form action="/login" method="post">
    <div class="mb-3 text-start">
        <label class="auth-label">მომხმარებლის სახელი</label>
        <input type="text" name="username" class="form-control-premium" placeholder="შეიყვანეთ სახელი" required>
    </div>

    <div class="mb-4 text-start">
        <label class="auth-label">პაროლი</label>
        <input type="password" name="password" class="form-control-premium" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn btn-gold mb-4 fw-bold">შესვლა</button>

    <div class="pt-4 border-top border-white border-opacity-10 text-center">
        <p class="text-white-50 small mb-3">არ გაქვთ ანგარიში? <a href="/signup" class="text-gold fw-bold text-decoration-none hover-glow">დარეგისტრირდით</a></p>
        <a href="/" class="btn btn-back-home rounded-pill px-4">
            <i class="fas fa-long-arrow-alt-left me-2"></i> მთავარზე დაბრუნება
        </a>
    </div>
</form>
{% endblock %}
