{% extends "layouts/main.html" %}

{% block title %}
    კონტაქტი
{% endblock %}

{% block main %}

<section class="py-5 mt-5">
    <div class="container">
        <!-- Section Header -->
        <div class="text-center mb-5">
            <h1 class="display-4 fw-bold text-white mb-3">დაგვიკავშირდით</h1>
            <p class="text-muted fs-5 mx-auto" style="max-width: 600px;">სენტინელ აკადემიის გუნდი მზად არის გიპასუხოთ ნებისმიერ კითხვაზე.</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-7 col-xl-6">
                <div class="premium-card p-4 p-md-5 border-gold border-opacity-25 shadow-sm overflow-hidden" style="background: var(--bg-card);">
                    <!-- Form Panel -->
                    <form method="POST" action="{{ url_for('main.contact') }}">
                        <div class="row g-4 text-start">
                            <div class="col-md-6">
                                <label for="name" class="auth-label mb-2">თქვენი სახელი</label>
                                <input type="text" class="form-control form-control-premium" id="name" name="name" placeholder="მაგ: გიორგი ბერიძე" required>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="auth-label mb-2">ელ-ფოსტა</label>
                                <input type="email" class="form-control form-control-premium" id="email" name="email" placeholder="example@mail.com" required>
                            </div>
                            <div class="col-12">
                                <label for="subject" class="auth-label mb-2">თემატიკა</label>
                                <select class="form-select form-control-premium" id="subject" name="subject" required>
                                    <option value="" disabled selected>აირჩიეთ მიმართულება</option>
                                    <option value="courses">კურსები</option>
                                    <option value="tech">მხარდაჭერა</option>
                                    <option value="other">სხვა</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label for="message" class="auth-label mb-2">შეტყობინება</label>
                                <textarea class="form-control form-control-premium" id="message" name="message" rows="5" placeholder="რით შეგვიძლია დაგეხმაროთ?" required></textarea>
                            </div>
                            <div class="col-12 pt-2">
                                <button type="submit" class="btn btn-gold btn-lg w-100 py-3 fw-bold">
                                    შეტყობინების გაგზავნა
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
